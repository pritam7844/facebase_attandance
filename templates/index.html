<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Attendance Records</h2>
    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Date</th><th>Check-In</th><th>Check-Out</th><th>Image</th>
        </tr>
        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.name }}</td>
            <td>{{ r.date }}</td>
            <td>{{ r.check_in_time }}</td>
            <td>{{ r.check_out_time }}</td>
            <td><img src="/{{ r.image_path }}" width="100"/></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
